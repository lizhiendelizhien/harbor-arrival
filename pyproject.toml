[build-system]
requires = ["setuptools>=67", "wheel", "pip"]
build-backend = "setuptools.build_meta"

[project]
name = "gear_sonic"
dynamic = ["version"]
readme = {text = "Latent policy training core", content-type = "text/plain"}
classifiers = [
    "Intended Audience :: Science/Research",
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
authors = [{name = "Latent Policy Research"}]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "torch>=2.4.0",
    "tqdm",
    "loguru",
]
license = {text = "Apache-2.0"}

[project.optional-dependencies]
finance = [
    "vector-quantize-pytorch==1.31.4",
    "tensordict==0.14.1",
    "omegaconf>=2.3,<2.4",
]
training = [
    "hydra-core==1.3.2",
    "wandb",
    "trl==0.28.0",
    "transformers>=4.56.2",
    "accelerate>=1.3.0",
    "tensorboard",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["gear_sonic*"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
gear_sonic = ["py.typed", "**/*.json", "**/*.yaml"]

[tool.setuptools.dynamic]
version = {attr = "gear_sonic.version.VERSION"}

[tool.black]
line-length = 100
include = '\\.pyi?$'
exclude = '''
(
      __pycache__
    | \.git
    | \.mypy_cache
    | \.pytest_cache
    | \.vscode
    | \.venv
    | \bdist\b
    | \blogs\b
)
'''

[tool.isort]
profile = "black"
multi_line_output = 3
skip = []
skip_glob = []

[tool.pyright]
reportPrivateImportUsage = false

[tool.ruff]
line-length = 115
target-version = "py310"
exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
case-sensitive = false
combine-as-imports = true
force-sort-within-sections = true
from-first = false
single-line-exclusions = ["typing"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[tool.mypy]
ignore_missing_imports = true
no_site_packages = true
check_untyped_defs = true
exclude = []

[tool.pytest.ini_options]
testpaths = "tests/"
log_format = "%(asctime)s - %(levelname)s - %(name)s - %(message)s"
log_level = "DEBUG"
